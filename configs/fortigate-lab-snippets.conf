# FortiGate lab configuration (FortiOS 8.0.1, VM permanent trial)
# Hand-written summary of the settings applied. The full backup is kept private.

config system global
    set hostname FGT-LAB
    set admin-sport 8443
    set admintimeout 10
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set pre-login-banner enable
    set strong-crypto enable
end
config system password-policy
    set status enable
    set apply-to admin-password
    set minimum-length 12
    set min-lower-case-letter 1
    set min-upper-case-letter 1
    set min-number 1
    set min-non-alphanumeric 1
end
config system admin
    edit admin
        set trusthost1 10.10.10.1 255.255.255.255
    next
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "162.159.200.1"
        next
    end
end
config system interface
    edit port1
        set alias WAN
        set role wan
        set mode dhcp
        set allowaccess ping
    next
    edit port2
        set alias LAN
        set role lan
        set ip 10.10.10.254 255.255.255.0
        set allowaccess ping https ssh
    next
    edit port3
        set alias DMZ
        set role dmz
        set ip 10.10.20.254 255.255.255.0
        set allowaccess ping
    next
end
config firewall address
    edit "LAN-net"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "DMZ-web"
        set subnet 10.10.20.10 255.255.255.255
    next
end
config webfilter urlfilter
    edit 1
        set name "lab-blocklist"
        config entries
            edit 1
                set url "*.facebook.com"
                set type wildcard
                set action block
            next
            edit 2
                set url "*.tiktok.com"
                set type wildcard
                set action block
            next
            edit 3
                set url "neverssl.com"
                set action block
            next
        end
    next
end
config webfilter profile
    edit "lab-webfilter"
        config web
            set urlfilter-table 1
        end
        config ftgd-wf
            # Trial has no FortiGuard: without this, every rating lookup fails closed
            set options error-allow
        end
    next
end
config firewall policy
    edit 1
        set name "LAN-to-Internet"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "LAN-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS" "NTP" "PING"
        set nat enable
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set webfilter-profile "lab-webfilter"
        set application-list "default"
        set logtraffic all
    next
    edit 2
        set name "LAN-to-DMZ-web"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "LAN-net"
        set dstaddr "DMZ-web"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "protect_http_server"
        set logtraffic all
    next
    edit 3
        set name "DMZ-to-Internet-updates"
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "DMZ-web"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS" "NTP"
        set nat enable
        set logtraffic all
    next
end
config log setting
    set fwpolicy-implicit-log enable
    set local-in-allow enable
    set local-in-deny-unicast enable
end
config log syslogd setting
    set status enable
    set server "10.10.10.50"
    set port 514
    set mode udp
    set facility local7
end
